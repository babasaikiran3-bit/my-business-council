[project]
name = "llm-council"
version = "0.1.0"
description = "Parenting Roundtable — science-backed parenting answers from a panel of LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "slowapi>=0.1.9",
    "gunicorn>=22.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a live OPENROUTER_API_KEY (skipped in CI)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Default rule set; ignore line-length (long Korean prompt strings are intentional).
ignore = ["E501"]
